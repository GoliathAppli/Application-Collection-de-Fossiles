<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#D4AF37" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#D4AF37" stroke-opacity="0.25" stroke-width="4"/>
  
  <!-- Stylized Ammonite / Fossil Symbol -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Outer spiral chamber -->
    <path d="M 0,-160 C 100,-160 170,-90 170,10 C 170,110 90,175 -10,175 C -110,175 -175,100 -175,0 C -175,-85 -115,-135 -35,-135 C 35,-135 85,-90 85,-20 C 85,45 40,85 -15,85 C -60,85 -85,55 -85,15 C -85,-20 -60,-40 -25,-40 C 0,-40 15,-25 15,-5 C 15,10 5,20 -5,20 C -12,20 -15,15 -15,8" 
          fill="none" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Chamber ribs / septa radiating out -->
    <line x1="0" y1="-160" x2="0" y2="-125" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
    <line x1="60" y1="-150" x2="45" y2="-115" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
    <line x1="120" y1="-115" x2="90" y2="-85" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
    <line x1="160" y1="-50" x2="120" y2="-35" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
    <line x1="170" y1="20" x2="125" y2="20" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
    <line x1="145" y1="95" x2="105" y2="75" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
    <line x1="90" y1="155" x2="65" y2="115" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
    <line x1="10" y1="175" x2="10" y2="130" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
    <line x1="-75" y1="155" x2="-55" y2="115" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
    <line x1="-140" y1="100" x2="-100" y2="75" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
    <line x1="-175" y1="15" x2="-125" y2="15" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
    <line x1="-155" y1="-65" x2="-110" y2="-45" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
    <line x1="-100" y1="-120" x2="-70" y2="-85" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Central pearl/core -->
    <circle cx="-5" cy="8" r="8" fill="url(#goldGrad)"/>
  </g>
</svg>
