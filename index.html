<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ma collection de fossiles</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="description" content="Inventaire géologique, fiches techniques et valorisation de collection paléontologique" />
    <meta name="application-name" content="Ma Collection de Fossiles" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fossiles" />
    <meta name="theme-color" content="#0B0F19" />
    <meta name="theme-color" content="#0B0F19" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />

    <!-- Icons & Manifest -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="mask-icon" href="./icon.svg" color="#D4AF37" />

    <script id="__FOSSIL_APP_INITIAL_DATA__" type="application/json">{}</script>
    <script id="__FOSSIL_APP_INITIAL_BANNER__" type="application/json">{}</script>
    <script>
      // Safe storage wrapper for file:// protocols or restricted sandboxes
      try {
        var _k = '__test_storage__';
        window.localStorage.setItem(_k, _k);
        window.localStorage.removeItem(_k);
      } catch (e) {
        var _mem = {};
        try {
          Object.defineProperty(window, 'localStorage', {
            value: {
              getItem: function(k) { return _mem[k] || null; },
              setItem: function(k, v) { _mem[k] = String(v); },
              removeItem: function(k) { delete _mem[k]; },
              clear: function() { _mem = {}; }
            },
            writable: true,
            configurable: true
          });
        } catch (polyErr) {}
      }

      window.__INITIAL_DATA__ = null;
      window.__INITIAL_BANNER__ = null;
      try {
        var dataScript = document.getElementById('__FOSSIL_APP_INITIAL_DATA__');
        if (dataScript && dataScript.textContent && dataScript.textContent.trim().length > 2) {
          window.__INITIAL_DATA__ = JSON.parse(dataScript.textContent);
        }
      } catch (e) {}
      try {
        var bannerScript = document.getElementById('__FOSSIL_APP_INITIAL_BANNER__');
        if (bannerScript && bannerScript.textContent && bannerScript.textContent.trim().length > 2) {
          window.__INITIAL_BANNER__ = JSON.parse(bannerScript.textContent);
        }
      } catch (e) {}
      try {
        var savedTheme = 'dark';
        try {
          if (window.localStorage) {
            savedTheme = window.localStorage.getItem('app_theme') || 'dark';
          }
        } catch (_) {}
        if (savedTheme === 'light') {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      } catch (e) {}

      // Global early capture for PWA Install Prompt (before React component mounts)
      try {
        window.__deferredPWAInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__deferredPWAInstallPrompt = e;
          window.dispatchEvent(new CustomEvent('pwa_prompt_ready'));
          console.log('[PWA] beforeinstallprompt captured successfully at boot');
        });
      } catch (e) {}

      // Service Worker Registration for PWA Offline Support (only on http / https)
      try {
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
          var registerSW = function() {
            navigator.serviceWorker.register('./sw.js', { scope: './' }).then(function(reg) {
              console.log('[PWA] Service Worker registered with scope:', reg.scope);
              reg.update().catch(function() {});
            }).catch(function(err) {
              console.warn('[PWA] Service Worker registration failed:', err);
            });
          };
          if (document.readyState === 'complete' || document.readyState === 'interactive') {
            registerSW();
          } else {
            window.addEventListener('DOMContentLoaded', registerSW);
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
